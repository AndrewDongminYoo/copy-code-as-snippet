name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Opt every JS action onto Node 24 ahead of the June 2026 removal of
# Node 20, including the ones nested inside trunk-action. This does NOT
# silence the "forced to run on Node 24" warning — that comes from
# trunk-action's own actions/cache & setup-node still declaring node20
# and only clears when trunk-action bumps them upstream.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: yarn

      - run: yarn install --frozen-lockfile

      - run: yarn lint

      # tsc: catches type errors webpack's transpile step would miss
      - run: yarn compile-tests

      # webpack + ts-loader: the check that would have caught the
      # typescript 7 breakage that shipped to main
      - run: yarn compile

  trunk:
    name: Trunk Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write # post lint results as annotations
    steps:
      - uses: actions/checkout@v7

      - uses: trunk-io/trunk-action@v1
        with:
          # The repo is already clean, so there is no hold-the-line
          # baseline to protect — check everything rather than only the
          # files a PR happens to touch.
          check-mode: all
          # eslint.config.mjs imports @typescript-eslint from node_modules,
          # so trunk's eslint needs the project's deps installed
          setup-deps: true

  # `yarn test` is intentionally not run here: vscode-test needs a virtual
  # display on Linux, and the suite is flaky ("command already exists" —
  # activate() re-registers in setup() without a reliable teardown), so it
  # would go red at random. Run it locally until the isolation leak is fixed.
